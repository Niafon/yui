[package]
name = "yui-stage"
version = "0.4.0"
edition = "2021"
description = "Live2D/VRM stage for Yui Core"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
