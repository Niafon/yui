<!doctype html>
<html lang="ru" data-theme="dark" class="avatar-window">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="app.avatarWindowTitle">Yui — аватар</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="view-avatar">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
        <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 3.5h6l-1 6 3.5 3.5h-11L10 9.5l-1-6ZM12 13v7.5"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
        <symbol id="i-ghost" viewBox="0 0 24 24"><path d="M5 20V10a7 7 0 0 1 14 0v10l-2.5-2-2.3 2-2.2-2-2.2 2-2.3-2L5 20Z"/><circle cx="9.5" cy="10.5" r=".8"/><circle cx="14.5" cy="10.5" r=".8"/></symbol>
        <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></symbol>
      </defs>
    </svg>
    <main class="pet" id="stage-frame">
      <canvas id="live2d" class="stage__canvas" width="420" height="640" aria-label="Аватар Юи" data-i18n-aria="app.avatarLabel"></canvas>
      <p id="figure-fallback" class="stage__fallback" role="status">Загрузка аватара…</p>
      <span id="emotion-label" class="stage__emotion" hidden></span>
      <button id="stage-audio" class="stage__audio" type="button" hidden data-i18n="app.enableSound">Включить звук</button>
      <p id="pet-status" class="pet__status" role="status"></p>
      <p id="pet-through-note" class="pet__through" hidden data-i18n="pet.clickThroughOn">Клики проходят сквозь окно · Ctrl+Shift+Y — вернуть</p>
      <div class="pet__bar" role="toolbar" aria-label="Окно аватара" data-i18n-aria="pet.toolbar">
        <button id="pet-drag" class="icon-button icon-button--small" type="button" title="Перетащить (или тяните за модель)" data-i18n-title="pet.drag" aria-label="Перетащить"><svg><use href="#i-move"/></svg></button>
        <button id="pet-smaller" class="icon-button icon-button--small" type="button" title="Отдалить" data-i18n-title="pet.smaller" aria-label="Отдалить"><svg><use href="#i-minus"/></svg></button>
        <button id="pet-bigger" class="icon-button icon-button--small" type="button" title="Приблизить" data-i18n-title="pet.bigger" aria-label="Приблизить"><svg><use href="#i-plus"/></svg></button>
        <button id="pet-top" class="icon-button icon-button--small" type="button" title="Поверх окон" data-i18n-title="pet.onTop" aria-label="Поверх окон" aria-pressed="true"><svg><use href="#i-pin"/></svg></button>
        <button id="pet-through" class="icon-button icon-button--small" type="button" title="Клики сквозь окно (выход: Ctrl+Shift+Y или трей)" aria-label="Клики сквозь окно" data-i18n-title="pet.clickThrough" hidden><svg><use href="#i-ghost"/></svg></button>
        <button id="pet-close" class="icon-button icon-button--small" type="button" title="Вернуть в основное окно" data-i18n-title="pet.close" aria-label="Закрыть окно аватара"><svg><use href="#i-close"/></svg></button>
      </div>
    </main>
    <script type="module" src="/src/avatar-window.ts"></script>
  </body>
</html>
