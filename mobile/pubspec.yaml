name: yui_companion
description: Yui Companion mobile client — microphone, camera and headphones for the PC core.
publish_to: none
version: 0.3.1+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.0
  http: ^1.2.0
  shared_preferences: ^2.3.0
  permission_handler: ^11.3.0
  mobile_scanner: ^5.2.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
